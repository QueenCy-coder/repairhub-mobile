# Keeps the hosted RepairHub API awake. Render's free tier sleeps after ~15 minutes without traffic, and the first
# request after that takes about 30 seconds. This pings the health check every 10 minutes.
# To stop it: GitHub → Actions → "Keep API awake" → ⋯ → Disable workflow (or delete this file).
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API health check
        run: curl --silent --show-error --max-time 90 --retry 2 https://repairhub-api-1.onrender.com/health
